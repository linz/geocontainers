name: Build

on:
  pull_request:
  push:
    branches: ['master']
  workflow_dispatch:

permissions: {}

# Supersede in-flight PR builds, but let master runs finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: docker build --tag actionlint - < .github/workflows/actionlint.dockerfile

      - name: Run actionlint to check workflow files
        run: docker run --volume="${PWD}:/repo" --workdir=/repo actionlint -color

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install the formatter
        run: npm ci

      - name: Check formatting
        run: npm run check

  build:
    strategy:
      fail-fast: false
      matrix:
        # The Dockerfile targets
        target: [gdal, pdal]
        # linux/arm64 also needs linux-aarch64 in pixi.toml's platforms
        platform: [linux/amd64]
        include:
          # Where each target is published (also in the publish job),
          # the conda package whose version it is tagged with, and its main program
          - target: gdal
            image: ghcr.io/linz/li-gdal-docker
            package: libgdal-core
            program: gdalinfo
          - target: pdal
            image: ghcr.io/linz/li-pdal-docker
            package: libpdal-core
            program: pdal
          - platform: linux/amd64
            runner: ubuntu-latest
          # - platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}-{1}', matrix.target, matrix.platform) || '' }}

      # The version comes from pixi.lock. Read it from the package records in the built image (conda-meta/*.json,
      # written when each package is installed), so the tag matches the image and not a program's output format.
      - name: Read the version the image will be tagged with
        id: version
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          PROGRAM: ${{ matrix.program }}
        run: |
          docker run --rm --network none "${TARGET}:ci" "${PROGRAM}" --version
          docker run --rm --network none "${TARGET}:ci" python --version
          version="$(docker run --rm --network none "${TARGET}:ci" sh -c 'cat "${CONDA_PREFIX}"/conda-meta/*.json' \
            | jq --raw-output --arg name "${PACKAGE}" 'select(.name == $name) | .version')"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::expected one ${PACKAGE} version in the image, found '${version}'"
            exit 1
          fi
          echo "${PACKAGE} ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The images replace conda's activation with ENV and keep the environment at a fixed path,
      # so check what geoprocessor runs works in them, including a CRS from PROJ's database

      - name: Check GDAL's scripts
        if: matrix.target == 'gdal'
        run: |
          docker run --rm --interactive --network none gdal:ci python - <<'EOF'
          import subprocess
          from osgeo import gdal, osr

          gdal.UseExceptions()

          # A 3x3 raster with a nodata hole in the middle
          dataset = gdal.GetDriverByName("GTiff").Create("/tmp/hole.tif", 3, 3, 1, gdal.GDT_Byte)
          dataset.GetRasterBand(1).SetNoDataValue(0)
          dataset.GetRasterBand(1).WriteRaster(0, 0, 3, 3, bytes([1, 1, 1, 1, 0, 1, 1, 1, 1]))
          dataset = None

          subprocess.run(["gdal_edit", "-a_srs", "EPSG:2193", "/tmp/hole.tif"], check=True)
          subprocess.run(["gdal_fillnodata", "-q", "/tmp/hole.tif", "/tmp/filled.tif"], check=True)

          filled = gdal.Open("/tmp/filled.tif")
          assert filled.GetRasterBand(1).ReadRaster() == bytes([1] * 9), list(filled.GetRasterBand(1).ReadRaster())
          assert osr.SpatialReference(filled.GetProjection()).GetAuthorityCode(None) == "2193", filled.GetProjection()
          EOF

      - name: Check PDAL with a LAZ file
        if: matrix.target == 'pdal'
        run: |
          docker run --rm --interactive --network none pdal:ci python - <<'EOF'
          import json
          import subprocess

          def pdal(*args, stdin=None):
              return subprocess.run(["pdal", *args], input=stdin, stdout=subprocess.PIPE, text=True, check=True).stdout

          # 100 generated points in a LAZ file
          pdal("pipeline", "--stdin", stdin=json.dumps([{"type": "readers.faux", "count": 100, "mode": "ramp", "bounds": "([0, 100], [0, 100], [0, 10])"}, "/tmp/points.laz"]))

          pdal("translate", "/tmp/points.laz", "/tmp/translated.laz", "--readers.las.spatialreference=EPSG:2193+7839", "--writers.las.filesource_id=0", "--writers.las.forward=all")

          metadata = json.loads(pdal("info", "--metadata", "/tmp/translated.laz"))["metadata"]
          result = {"count": metadata["count"], "compressed": metadata["compressed"], "srs": [component["id"]["code"] for component in metadata["srs"]["json"]["components"]]}
          assert result == {"count": 100, "compressed": True, "srs": [2193, 7839]}, result
          EOF

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag so each platform can be collected into one manifest list below.
      # The layers are already in the builder cache, so this does not rebuild.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Write the digest and version to files
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the push step did not report a sha256 digest: '${DIGEST}'"
            exit 1
          fi
          mkdir -p /tmp/build/digests
          touch "/tmp/build/digests/${DIGEST#sha256:}"
          echo "${VERSION}" > /tmp/build/version

      - name: Upload the digest and version
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/build/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Where each target is published (also in the build job)
          - target: gdal
            image: ghcr.io/linz/li-gdal-docker
          - target: pdal
            image: ghcr.io/linz/li-pdal-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download the digests and version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/build
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the digests as one image
        id: tag
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="$(cat /tmp/build/version)"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::the build job did not report a usable version: '${version}'"
            exit 1
          fi
          shopt -s nullglob
          refs=()
          for digest in /tmp/build/digests/*; do refs+=("${IMAGE}@sha256:$(basename "$digest")"); done
          if (( ${#refs[@]} == 0 )); then
            echo "::error::no digests were downloaded from the build job"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:${version}-${GITHUB_SHA::7}" \
            "${refs[@]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Report the reference to pin
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning::could not read the manifest digest, skipping the pin hint"
            exit 0
          fi
          {
            echo "Pin this image with:"
            echo '```'
            echo "${IMAGE}:${VERSION}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
